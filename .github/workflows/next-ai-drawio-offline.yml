name: Sync upstream and build offline image

on:
  workflow_dispatch:
  schedule:
    # Daily 02:23 UTC = 10:23 Asia/Taipei
    - cron: '23 2 * * *'
  push:
    branches:
      - main

concurrency:
  group: next-ai-drawio-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      source_sha: ${{ steps.update.outputs.source_sha }}
      upstream_sha: ${{ steps.update.outputs.upstream_sha }}
    steps:
      - name: Checkout fork main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main (never force push)
        id: update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/DayuanJiang/next-ai-draw-io.git
          git fetch --no-tags upstream main
          before=$(git rev-parse HEAD)
          git merge --no-edit upstream/main
          after=$(git rev-parse HEAD)
          if [[ "$before" != "$after" ]]; then
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
          echo "source_sha=$after" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"

  build:
    name: Build amd64, archive, publish GHCR
    needs: sync
    # Scheduled runs only rebuild when upstream changed. Manual/push always build.
    if: needs.sync.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout precisely the synchronized commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.source_sha }}

      - name: Set image names
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="$(git rev-parse --short=12 HEAD)"
          echo "IMAGE=ghcr.io/$owner/next-ai-draw-io" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image with compiled /nextaidrawio prefix
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_BASE_PATH=/nextaidrawio \
            --build-arg NEXT_PUBLIC_DRAWIO_BASE_URL= \
            --build-arg NEXT_PUBLIC_SELFHOSTED=true \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE}:subpath" \
            --tag "${IMAGE}:subpath-${SHORT_SHA}" \
            --tag 'next-ai-draw-io:offline' \
            --load .

      - name: Save compressed offline tar and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="next-ai-draw-io-linux-amd64-${SHORT_SHA}.tar.gz"
          docker save next-ai-draw-io:offline | gzip -1 > "dist/${archive}"
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          {
            echo "fork_commit=$(git rev-parse HEAD)"
            echo 'upstream_commit=${{ needs.sync.outputs.upstream_sha }}'
            echo 'base_path=/nextaidrawio'
            echo 'platform=linux/amd64'
            echo 'offline_image=next-ai-draw-io:offline'
            echo "ghcr_image=${IMAGE}:subpath-${SHORT_SHA}"
          } > dist/build-info.txt

      - name: Upload offline image artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-ai-draw-io-amd64-${{ env.SHORT_SHA }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable and floating tags
        shell: bash
        run: |
          set -euo pipefail
          docker push "${IMAGE}:subpath-${SHORT_SHA}"
          docker push "${IMAGE}:subpath"
